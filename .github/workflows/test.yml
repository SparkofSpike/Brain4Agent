name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[precise,dev]"

      - name: Lint
        run: |
          python -m ruff check src bench tests
          python -m ruff format --check src bench tests

      - name: Test
        # The encoding matrix lives in tests/test_mcp_server.py, which starts
        # real subprocesses under utf-8, cp936 and ascii. It runs here rather
        # than in a CI matrix so the same coverage is available locally.
        run: python -m pytest tests/ -q

      - name: Retrieval regression
        # A change to tokenisation, scoring or evidence that lowers hit@1 below
        # the recorded baseline fails the build instead of being noticed later.
        run: python -m bench.zh.e2e --min-hit1 0.92

      - name: PrecisionMemBench and LoCoMo regression
        # README names all three benchmarks as the gate. Only the Chinese one
        # could fail the build: the other two printed their numbers and returned
        # 0 regardless, so a drop from 64/77 or from hit@1 0.6270 shipped green.
        # Thresholds sit just under the recorded values, like the one above.
        run: |
          python -m bench.pmb.run --min-pass 0.82 --min-active 0.78
          python -m bench.locomo.run --min-hit1 0.62
