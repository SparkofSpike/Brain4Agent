name: release

# Publishes to PyPI when a version tag is pushed. Uses PyPI's Trusted Publishing:
# no API token is stored in this repository, and nothing long-lived is on this
# machine. PyPI has to be told once, out of band, that this repository and this
# workflow file are allowed to publish -- see docs/release.md.
#
# The alternative, a PYPY_API_TOKEN secret plus `twine upload`, is one forgotten
# rotation away from a leaked credential. Here the credential is a short-lived
# OIDC token that PyPI issues to this job for the length of the job.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Publish the version currently in pyproject.toml? Type yes."
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Check the wheel installs and the CLI runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/brain4agent --help > /dev/null
          /tmp/check/bin/python -c "import brain4agent; print(brain4agent.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brain4agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
