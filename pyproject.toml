[build-system]
requires = ["setuptools>=77"]  # 77 is the first with PEP 639 license support
build-backend = "setuptools.build_meta"

[project]
name = "Brain4Agent"
version = "0.1.0"
description = "Long-term memory for agents. Chinese-first, split read/write paths, explicit abstention."
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
brain4agent = "brain4agent.cli:main"

[project.optional-dependencies]
# Only what Stage 0 actually needs. Nothing is added before a benchmark
# number shows it is necessary -- see docs/decisions.md.
dev = ["pytest>=8"]
# Not a hard requirement, but the single biggest retrieval win measured so
# far: dictionary segmentation takes hit@1 from 0.825 to 0.925 (D-019).
# Without it the core falls back to bigrams on both sides and still works.
precise = ["jieba>=0.42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
addopts = "-q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
