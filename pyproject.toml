[build-system]
requires = ["setuptools>=77"]  # 77 is the first with PEP 639 license support
build-backend = "setuptools.build_meta"

[project]
name = "Brain4Agent"
version = "0.0.2"
description = "Long-term memory for agents. CJK-first, split read/write paths, explicit abstention."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent-memory", "mcp", "bm25", "cjk", "sqlite", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[[project.authors]]
name = "Brain4Agent contributors"

[project.urls]
Homepage = "https://github.com/SparkofSpike/Brain4Agent"
Repository = "https://github.com/SparkofSpike/Brain4Agent"
Issues = "https://github.com/SparkofSpike/Brain4Agent/issues"
Decisions = "https://github.com/SparkofSpike/Brain4Agent/blob/main/docs/decisions.md"

[project.scripts]
brain4agent = "brain4agent.cli:main"

[project.optional-dependencies]
# Only what Stage 0 actually needs. Nothing is added before a benchmark
# number shows it is necessary -- see docs/decisions.md.
# Pinned on purpose. A floor of 0.6 let CI install 0.17.4 while this machine had
# 0.16.2, and 0.17.4 added an F841 rule that flagged two test files the local
# linter had passed for weeks. A gate whose rules change under you is not a gate.
dev = ["pytest>=8", "ruff==0.17.4"]
# Not a hard requirement, but the single biggest retrieval win measured so
# far: dictionary segmentation takes hit@1 from 0.825 to 0.925 (D-019).
# Without it the core falls back to bigrams on both sides and still works.
precise = ["jieba>=0.42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
addopts = "-q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
